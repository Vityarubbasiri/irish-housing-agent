[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "housing"
version = "0.1.0"
description = "Irish Property Price Register analysis, price model and LLM agent"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
